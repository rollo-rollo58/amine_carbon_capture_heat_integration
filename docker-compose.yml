services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: capture
      POSTGRES_USER: capture
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in shell}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capture -d capture"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - pg_capture:/var/lib/postgresql/data
  backend:
    build: ./backend
    environment:
      APP_ENV: demonstration
      ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
  frontend:
    image: node:22-alpine
    working_dir: /workspace
    volumes:
      - ./frontend:/workspace
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
volumes:
  pg_capture:
